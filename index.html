<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hot Video Call Service</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
    header { background: #ff4d4d; color: white; padding: 15px; text-align: center; }
    .container { max-width: 900px; margin: 20px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; }
    form { display: flex; flex-direction: column; gap: 10px; }
    input, select, button { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
    button { background: #ff4d4d; color: white; border: none; cursor: pointer; }
    button:hover { background: #e60000; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
    .model-card { background: #fff0f0; padding: 10px; text-align: center; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1);}
  </style>
</head>
<body>

<header>
  <h1>Hot Video Call Service</h1>
</header>

<div class="container" id="auth-section">
  <h2>Login / Register</h2>

  <!-- Registration Form -->
  <form id="register-form">
    <h3>Register</h3>
    <input type="text" id="reg-mobile" placeholder="Mobile Number" required>
    <input type="password" id="reg-password" placeholder="Password" required>
    <select id="reg-gender" required>
      <option value="">Select Gender</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
    </select>
    <button type="button" onclick="registerUser()">Register</button>
  </form>

  <hr>

  <!-- Login Form -->
  <form id="login-form">
    <h3>User Login</h3>
    <input type="text" id="login-mobile" placeholder="Mobile Number" required>
    <input type="password" id="login-password" placeholder="Password" required>
    <button type="button" onclick="loginUser()">Login</button>
  </form>

  <hr>

  <!-- Admin Login -->
  <form id="admin-form">
    <h3>Admin Login</h3>
    <input type="text" id="admin-user" placeholder="Admin Username" required>
    <input type="password" id="admin-pass" placeholder="Password" required>
    <button type="button" onclick="adminLogin()">Admin Login</button>
  </form>
</div>

<div class="container" id="models-section" style="display:none;">
  <h2>Available Models</h2>
  <div class="grid" id="models-grid">
    <!-- Sample Models -->
    <div class="model-card">Model 1</div>
    <div class="model-card">Model 2</div>
    <div class="model-card">Model 3</div>
    <div class="model-card">Model 4</div>
  </div>
</div>

<script>
  const users = [];
  const models = [];

  function registerUser() {
    const mobile = document.getElementById('reg-mobile').value;
    const password = document.getElementById('reg-password').value;
    const gender = document.getElementById('reg-gender').value;

    if (!mobile || !password || !gender) { alert("Please fill all fields!"); return; }

    const user = { mobile, password, gender };
    users.push(user);

    if (gender === 'female') {
      alert("You are registered as a model! Admin approval might be needed.");
      models.push(user);
    } else {
      alert("Registration successful! You can login directly.");
    }

    document.getElementById('register-form').reset();
    showModelsForGuest();
  }

  function loginUser() {
    const mobile = document.getElementById('login-mobile').value;
    const password = document.getElementById('login-password').value;

    const user = users.find(u => u.mobile === mobile && u.password === password);
    if (!user) { alert("Invalid credentials!"); return; }

    if (user.gender === 'male') {
      alert("Welcome, male user! Direct login successful.");
    } else {
      alert("Welcome, model! Access granted.");
    }

    document.getElementById('auth-section').style.display = 'none';
    document.getElementById('models-section').style.display = 'block';
  }

  function adminLogin() {
    const user = document.getElementById('admin-user').value;
    const pass = document.getElementById('admin-pass').value;

    if (user === 'admin' && pass === 'admin123') {
      alert("Admin logged in!");
      console.log("Registered users:", users);
      console.log("Models:", models);
    } else {
      alert("Invalid admin credentials!");
    }
  }

  function showModelsForGuest() {
    document.getElementById('models-section').style.display = 'block';
  }

  // Show models grid for unlogged users
  showModelsForGuest();
</script>

</body>
</html>
