    <div class="toggle-text" id="toggleText">
      Already have an account? <a onclick="toggleForm()">Login</a>
    </div>
  </div>

  <script>
    let isLogin = false;

    function toggleForm() {
      isLogin = !isLogin;
      document.getElementById("formTitle").innerText = isLogin ? "Login" : "Register";
      document.getElementById("submitBtn").innerText = isLogin ? "Login" : "Register";
      document.getElementById("toggleText").innerHTML = isLogin 
        ? `Don't have an account? <a onclick="toggleForm()">Register</a>`
        : `Already have an account? <a onclick="toggleForm()">Login</a>`;
    }

    document.getElementById("authForm").addEventListener("submit", function(e) {
      e.preventDefault();
      let mobile = document.getElementById("mobile").value;
      let password = document.getElementById("password").value;

      if (!isLogin) {
        // Registration
        localStorage.setItem("userMobile", mobile);
        localStorage.setItem("userPassword", password);

        // Auto login
        document.getElementById("authBox").innerHTML = `
          <p class="welcome">🎉 Welcome ${mobile}, You are now logged in!</p>
        `;
      } else {
        // Login check
        let savedMobile = localStorage.getItem("userMobile");
        let savedPassword = localStorage.getItem("userPassword");

        if (mobile === savedMobile && password === savedPassword) {
          document.getElementById("authBox").innerHTML = `
            <p class="welcome">✅ Login Successful! Welcome back ${mobile}</p>
          `;
        } else {
          alert("❌ Invalid mobile or password");
        }
      }
    });
  </script>
</body>
