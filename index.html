<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Fun Service</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f2f2f2; }
    header { background: #ff3366; color: #fff; padding: 1rem; text-align: center; }
    .container { padding: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 1rem; }
    .card { background: #fff; padding: 1rem; border-radius: 10px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    button { background: #ff3366; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; }
    input, select { width: 100%; padding: 0.5rem; margin: 0.3rem 0; border-radius: 5px; border: 1px solid #ccc; }
    nav { display: flex; justify-content: space-around; background: #fff; padding: 0.5rem; position: sticky; bottom: 0; }
    nav a { text-decoration: none; color: #ff3366; font-weight: bold; }
  </style>
</head>
<body>

<header>
  <h1>Online Fun Service</h1>
</header>

<div class="container">
  <!-- Registration Form -->
  <h2>Register</h2>
  <form id="registerForm">
    <input type="text" placeholder="Full Name" required id="fullName">
    <input type="tel" placeholder="Mobile Number" required id="mobile">
    <input type="password" placeholder="Password" required id="password">
    <select id="role" required>
      <option value="">Select Option</option>
      <option value="male">Male (User)</option>
      <option value="female">Female (Model)</option>
    </select>
    <button type="submit">Register</button>
  </form>

  <hr>

  <!-- Login Form -->
  <h2>Login</h2>
  <form id="loginForm">
    <input type="tel" placeholder="Mobile Number" required id="loginMobile">
    <input type="password" placeholder="Password" required id="loginPassword">
    <button type="submit">Login</button>
  </form>

  <hr>

  <!-- Home Grid View (Female Models) -->
  <h2>Online Female Models</h2>
  <div class="grid" id="modelGrid">
    <!-- Models will appear here -->
  </div>
</div>

<nav>
  <a href="#">Home</a>
  <a href="#">Profile</a>
  <a href="#">Dashboard</a>
</nav>

<script>
  // Dummy model data for grid view
  const models = [
    { name: "Anita", online: true },
    { name: "Sofia", online: true },
    { name: "Meera", online: false },
    { name: "Rina", online: true }
  ];

  const modelGrid = document.getElementById("modelGrid");
  function displayModels() {
    modelGrid.innerHTML = "";
    models.forEach(model => {
      if(model.online){
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <h3>${model.name}</h3>
          <p>Status: ${model.online ? 'Online' : 'Offline'}</p>
          <button onclick="alert('Chat / Call placeholder')">Chat / Call</button>
        `;
        modelGrid.appendChild(card);
      }
    });
  }

  displayModels();

  // Registration handler (placeholder)
  document.getElementById("registerForm").addEventListener("submit", function(e){
    e.preventDefault();
    const name = document.getElementById("fullName").value;
    const mobile = document.getElementById("mobile").value;
    const password = document.getElementById("password").value;
    const role = document.getElementById("role").value;
    alert(`Registered ${role}: ${name} (${mobile})`);
  });

  // Login handler (placeholder)
  document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    const mobile = document.getElementById("loginMobile").value;
    const password = document.getElementById("loginPassword").value;
    alert(`Logged in as: ${mobile}`);
  });
</script>

</body>
</html>
