<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Fun Service</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f7f7f7;
      text-align: center;
    }
    header {
      background: #ff4d4d;
      color: white;
      padding: 15px;
      font-size: 24px;
      font-weight: bold;
    }
    .login-box {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      width: 220px;
    }
    .login-box input, .login-box select, .login-box button {
      width: 100%;
      margin: 5px 0;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .login-box button {
      background: #ff4d4d;
      color: white;
      border: none;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin: 80px 20px 50px;
    }
    .profile {
      background: white;
      border-radius: 15px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      padding: 10px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .profile:hover {
      transform: scale(1.05);
    }
    .profile img {
      width: 100%;
      border-radius: 10px;
    }
    .tagline {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #ff4d4d;
      color: white;
      padding: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>Online Fun Service</header>

  <!-- Small Login/Register box -->
  <div class="login-box">
    <h4>Login / Register</h4>
    <input type="text" placeholder="Mobile Number">
    <input type="password" placeholder="Password">
    <select>
      <option>Select Gender</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>
    <button>Register</button>
    <hr>
    <input type="text" placeholder="Mobile Number">
    <input type="password" placeholder="Password">
    <button>Login</button>
  </div>

  <!-- Grid View Profiles -->
  <div class="grid">
    <div class="profile">
      <img src="https://via.placeholder.com/200" alt="Profile">
      <h3>Anna, 22</h3>
    </div>
    <div class="profile">
      <img src="https://via.placeholder.com/200" alt="Profile">
      <h3>Rahul, 25</h3>
    </div>
    <div class="profile">
      <img src="https://via.placeholder.com/200" alt="Profile">
      <h3>Sophia, 23</h3>
    </div>
    <div class="profile">
      <img src="https://via.placeholder.com/200" alt="Profile">
      <h3>Aryan, 26</h3>
    </div>
  </div>

  <!-- App Tagline -->
  <div class="tagline">
    Make Friends · Video Call Fun · Meeting
  </div>

</body>
</html>
