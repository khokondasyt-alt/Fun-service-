<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Fun Service - Login/Register</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .form-container {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    .form-container h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #444;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    .form-group input:focus {
      border-color: #2575fc;
      box-shadow: 0 0 5px rgba(37,117,252,0.5);
    }

    .btn {
      width: 100%;
      background: #2575fc;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #1a5fd0;
    }

    .toggle-text {
      margin-top: 15px;
      font-size: 14px;
    }

    .toggle-text a {
      color: #2575fc;
      font-weight: bold;
      cursor: pointer;
    }

    .welcome {
      font-size: 18px;
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body>
  <div class="form-container" id="authBox">
    <h2 id="formTitle">Register</h2>
    <form id="authForm">
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" id="mobile" placeholder="Enter your mobile number" required pattern="[0-9]{10}">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">Register</button>
    </form>
    <div class="toggle-text" id="toggleText">
      Already have an account? <a onclick="toggleForm()">Login</a>
    </div>
  </div>

  <script>
    let isLogin = false;

    function toggleForm() {
      isLogin = !isLogin;
      document.getElementById("formTitle").innerText = isLogin ? "Login" : "Register";
      document.getElementById("submitBtn").innerText = isLogin ? "Login" : "Register";
      document.getElementById("toggleText").innerHTML = isLogin 
        ? `Don't have an account? <a onclick="toggleForm()">Register</a>`
        : `Already have an account? <a onclick="toggleForm()">Login</a>`;
    }

    document.getElementById("authForm").addEventListener("submit", function(e) {
      e.preventDefault();
      let mobile = document.getElementById("mobile").value;
      let password = document.getElementById("password").value;

      if (!isLogin) {
        // Registration
        localStorage.setItem("userMobile", mobile);
        localStorage.setItem("userPassword", password);

        // Auto login
        document.getElementById("authBox").innerHTML = `
          <p class="welcome">🎉 Welcome ${mobile}, You are now logged in!</p>
        `;
      } else {
        // Login check
        let savedMobile = localStorage.getItem("userMobile");
        let savedPassword = localStorage.getItem("userPassword");

        if (mobile === savedMobile && password === savedPassword) {
          document.getElementById("authBox").innerHTML = `
            <p class="welcome">✅ Login Successful! Welcome back ${mobile}</p>
          `;
        } else {
          alert("❌ Invalid mobile or password");
        }
      }
    });
  </script>
</body>
</html>
